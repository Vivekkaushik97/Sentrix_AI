spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: ${DB_TIMEOUT_CONN:30000}
      idle-timeout: ${DB_TIMEOUT_IDLE:600000}
      max-lifetime: ${DB_TIMEOUT_MAX_LIFETIME:1800000}

  data:
    redis:
      host: ${SPRING_REDIS_HOST}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD}
      timeout: ${REDIS_TIMEOUT:2000}

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}
    connection-timeout: ${RABBITMQ_CONN_TIMEOUT:5000}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: ${RABBITMQ_RETRY_MAX:3}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: ${SERVER_TOMCAT_MAX_THREADS:200}
      min-spare: ${SERVER_TOMCAT_MIN_THREADS:10}
    connection-timeout: ${SERVER_CONN_TIMEOUT:20000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.sentrix.ai: ${LOG_LEVEL:INFO}

sentrix:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  ai:
    timeout: ${AI_PROVIDER_TIMEOUT:10000}
